name: Update Profile Cards

on:
  schedule:
    - cron: '0 0 * * *' # Run once every day at midnight
  workflow_dispatch: # Allow manual execution

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&bg_color=161B22&title_color=00D4FF&text_color=C9D1D9&icon_color=00D4FF&border_color=30363D
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=4&bg_color=161B22&title_color=00D4FF&text_color=C9D1D9&icon_color=00D4FF&border_color=30363D
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=react-dark&bg_color=161B22&title_color=00D4FF&color=C9D1D9&line=00D4FF&point=00D4FF&hide_border=true
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SVG Cards
        run: |
          for file in profile/stats.svg profile/top-langs.svg profile/activity-graph.svg; do
            if [ ! -f "$file" ]; then
              echo "Error: $file does not exist."
              exit 1
            fi
            if [ ! -s "$file" ]; then
              echo "Error: $file is empty."
              exit 1
            fi
            if ! grep -q "<svg" "$file"; then
              echo "Error: $file is not a valid SVG file."
              exit 1
            fi
            if grep -q -i "something went wrong" "$file"; then
              echo "Error: $file contains error text 'Something went wrong'. Skipping commit to prevent broken cards."
              exit 1
            fi
          done
          echo "All SVG cards successfully validated!"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/activity-graph.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile cards [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
